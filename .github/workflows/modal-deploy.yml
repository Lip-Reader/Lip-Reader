# Deploy the vsr_lip_reader service to Modal whenever something it bundles
# changes on main. Needs the repo secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET
# (Settings -> Secrets and variables -> Actions), created with `modal token new`.
name: modal-deploy

on:
  push:
    branches: [main]
    paths:
      - "modal_app.py"
      - "backend/**"
      - "!backend/tests/**"
      - "assets/configs/**"
      - ".github/workflows/modal-deploy.yml"
  workflow_dispatch:

concurrency:
  group: modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # only the Modal client is needed locally; torch etc. are built into the image
      - name: Install Modal client
        run: pip install "modal>=1.5,<2"

      - name: Deploy chaplin-ai
        run: modal deploy modal_app.py

      - name: Smoke test /health
        run: |
          sleep 5
          curl -sSf --max-time 120 --retry 5 --retry-delay 10 --retry-all-errors \
            https://adamsi--chaplin-ai-backend.modal.run/health
